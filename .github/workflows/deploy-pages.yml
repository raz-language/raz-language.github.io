name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh canonical Raz data and documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAZ_SITE_URL: ${{ vars.RAZ_SITE_URL }}
        run: python3 scripts/sync_site.py --refresh
      - name: Run generator regression tests
        run: python3 scripts/test_sync_regressions.py
      - name: Validate generated source tree
        run: python3 scripts/validate.py
      - name: Check performance budgets
        run: python3 scripts/check_performance.py
      - name: Stage public website
        run: python3 scripts/stage_site.py --output _site
      - name: Check deploy performance budgets
        run: python3 scripts/check_performance.py --root _site
      - name: Validate deploy artifact
        run: python3 scripts/validate.py --root _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
