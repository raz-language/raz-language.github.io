name: validate-site
on:
  # Main already runs the full validation suite inside deploy-pages.
  # Keep this workflow for PRs, non-main branches, and explicit manual checks
  # so one main push does not launch two copies of the same expensive build.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deterministic generated snapshot
        run: python3 scripts/sync_site.py --offline --check
      - name: Run generator regression tests
        run: python3 scripts/test_sync_regressions.py
      - name: Check package search contract
        run: python3 scripts/test_package_search.py
      - name: Check browser asset cache keys
        run: python3 scripts/test_asset_cache_busting.py
      - name: Check generated performance budget regression
        run: python3 scripts/test_performance_budget_generation.py
      - name: Validate source tree
        run: python3 scripts/validate.py
      - name: Check performance budgets
        run: python3 scripts/check_performance.py
      - name: Stage deployable site
        run: python3 scripts/stage_site.py --output _site
      - name: Check deploy performance budgets
        run: python3 scripts/check_performance.py --root _site
      - name: Validate deployable site
        run: python3 scripts/validate.py --root _site
